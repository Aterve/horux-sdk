name: 2 · Publish — Python

# `workflow_dispatch` ONLY, and this is a hard requirement rather than a preference:
#
#     Reusable workflows are **not currently supported** by PyPI's Trusted Publishing
#     -- https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
#     (a practical limitation, tracked in pypi/warehouse#11096)
#
# Measured, on the first Python release attempt: called as a reusable workflow from
# release.yml this failed with `invalid-publisher: valid token, but no corresponding
# publisher (Publisher with matching claims was not found)` and the action printed the
# warning above. PyPI's own docs do not mention reusable workflows at all; the action does.
#
# So the OIDC exchange has to happen in a workflow that was TRIGGERED, not called. This one
# is dispatched -- by a human, or by `3 · Release — SDKs (manual)`, which can dispatch it
# because `workflow_dispatch` is an explicit exception to the rule that GITHUB_TOKEN-driven
# events start no workflows. The trusted publisher on PyPI therefore names
# **publish-python.yml**, not release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

# Least privilege by default; the jobs that publish or tag override this.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: PyPI exchanges this short-lived OIDC token for a one-shot
      # upload credential, so there is no API token anywhere. Must also be granted by the
      # CALLING job in release.yml; scripts/check-workflow-permissions.mjs enforces that.
      id-token: write

    outputs:
      version: ${{ steps.package_version.outputs.version }}

    defaults:
      run:
        working-directory: ./python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The steps that used to sit here derived the version from `refs/tags/` behind
      # `github.event_name == 'push'`. Unreachable now: this workflow is
      # `workflow_call`-only, and inside a called workflow `github.event_name` is the
      # CALLER's event (`workflow_dispatch` for release.yml). A step that can never run
      # reads like a path that works.

      - name: Update package version (manual/called)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.version != ''
        run: |
          sed -i "s/^version = .*/version = \"${{ inputs.version }}\"/" pyproject.toml
          grep "^version = " pyproject.toml

      - name: Install package dependencies
        # `[dev,lint]`, not `[dev]`. `[dev]` is pytest and types-requests; black, ruff and
        # mypy live in `[lint]` because they publish no wheels for 3.8 and would break the
        # test matrix's oldest leg. This job pins 3.11, so it can have both -- and it needs
        # both, because the gates below are no longer swallowed: with
        # `continue-on-error: true` on them, `mypy: command not found` (exit 127) was
        # invisible and a release published without ever type-checking. Making them
        # blocking is what surfaced it, on the first Python release attempt.
        run: pip install -e ".[dev,lint]"

      # Blocking, measured rather than assumed: mypy, ruff, black and pytest all exit 0 on
      # this tree today. They used to be `|| echo ... continuing` AND
      # `continue-on-error: true` -- swallowed twice, so a release published a failing SDK
      # and said nothing.
      - name: Run type checking
        run: mypy horux_client/

      - name: Run linting
        run: |
          black --check .
          ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Verify package
        run: |
          echo "Package contents:"
          ls -la dist/
          echo ""
          echo "Checking package with twine:"
          twine check dist/*

      - name: Get package version
        id: package_version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      # PyPI, which is the only registry that serves Python packages -- GitHub Packages has
      # no PyPI support at all. This step used to upload to
      # `https://nuget.pkg.github.com/<owner>`, the NuGet endpoint, behind
      # `continue-on-error: true`: it could never have worked, and said nothing when it
      # didn't. The flag is gone with it; a publish that fails must fail the release.
      # The exact value PyPI will match, printed so the trusted-publisher form cannot be
      # filled in from guesswork. `github.workflow_ref` is the workflow that STARTED the
      # run, which inside a called workflow is the CALLER -- the claim PyPI checks. PyPI's
      # own docs do not cover reusable workflows, so this line is how the first release
      # proves which filename belongs in the form.
      - name: Show the workflow identity PyPI will see
        run: |
          echo "workflow_ref : ${{ github.workflow_ref }}"
          echo "repository   : ${{ github.repository }}"
          echo "Configure the PyPI trusted publisher with the workflow FILENAME above."

      # Trusted publishing (OIDC). No PYPI_PUBLISH_TOKEN, and none needed even for the very
      # first upload: PyPI supports a "pending publisher", which creates the project on
      # first use and then converts itself into a normal publisher. That is the difference
      # from npm, where the package must exist before a trusted publisher can be configured
      # at all -- so the TypeScript side keeps a documented one-off token path and this one
      # does not.
      #
      # `packages-dir` is relative to the WORKSPACE, not to this job's `working-directory`,
      # which is why it says `python/dist` and not `dist`.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist
          print-hash: true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: python/dist/
          retention-days: 30

      - name: Create summary
        run: |
          VERSION="${{ steps.package_version.outputs.version }}"
          REPO_OWNER="${{ github.repository_owner }}"

          echo "## Python Package Published 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`horux-client\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install horux-client==${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "The wheel and sdist are also attached as build artifacts on this workflow run." >> $GITHUB_STEP_SUMMARY

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    # Runs on every release, not only a tag push. The condition here used to be
    # `github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')`, and inside a
    # called workflow `github.event_name` is the CALLER's event -- `workflow_dispatch` for
    # release.yml -- so this job was SKIPPED on every release. Demonstrated on the first
    # real publish: the package reached its registry and the repository kept no tag and no
    # release to say so. `needs` already gates this on a successful publish.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/

      # The step that used to sit here re-derived the version by stripping
      # `refs/tags/` from GITHUB_REF. Under a dispatch that is `refs/heads/main`, so it
      # produced a "version" of `refs/heads/main` -- which named the release
      # `Python SDK vrefs/heads/main` and made the asset upload look for
      # `dist/horux_client-refs/heads/main-py3-none-any.whl` (ENOENT). The version comes
      # from the job that built the artifact instead: `needs.build-and-publish.outputs.version`.
      - name: Create GitHub Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: python-v${{ needs.build-and-publish.outputs.version }}
          release_name: Python SDK v${{ needs.build-and-publish.outputs.version }}
          body: |
            # Python SDK v${{ needs.build-and-publish.outputs.version }}

            ## Installation

            Download the wheel from the release assets below, then install:

            ```bash
            pip install horux_client-${{ needs.build-and-publish.outputs.version }}-py3-none-any.whl
            ```

            ## Quick Start

            ```python
            from horux_client import HoruxClient

            client = HoruxClient(
                api_token="your-api-token",
                service_id="your-service-id"
            )

            # Push metrics
            client.metrics.counter("http.requests.total", 1, {"method": "GET", "status": "200"})
            client.metrics.gauge("response.time", 145.5, {"endpoint": "/api/users"})

            # Push logs
            client.logs.info("User logged in", {"user_id": "123", "ip": "192.168.1.1"})

            # Flush and close
            client.close()
            ```

            ## Changes

            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/python/CHANGELOG.md) for details.

            ## Documentation

            - [README](https://github.com/${{ github.repository }}/blob/main/python/README.md)

            ## Supported Python Versions

            - Python 3.8 – 3.12
          draft: false
          prerelease: ${{ inputs.prerelease || contains(needs.build-and-publish.outputs.version, 'alpha') || contains(needs.build-and-publish.outputs.version, 'beta') || contains(needs.build-and-publish.outputs.version, 'rc') }}

      - name: Upload wheel to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/horux_client-${{ needs.build-and-publish.outputs.version }}-py3-none-any.whl
          asset_name: horux_client-${{ needs.build-and-publish.outputs.version }}-py3-none-any.whl
          asset_content_type: application/zip

      - name: Upload sdist to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/horux_client-${{ needs.build-and-publish.outputs.version }}.tar.gz
          asset_name: horux_client-${{ needs.build-and-publish.outputs.version }}.tar.gz
          asset_content_type: application/gzip
