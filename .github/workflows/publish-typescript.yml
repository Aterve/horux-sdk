name: 2 · Publish — TypeScript

# `workflow_call` ONLY, and that is a requirement of npm trusted publishing rather than a
# preference. npm validates the OIDC claim against the **calling** workflow's filename, so
# a package configured for `release.yml` cannot also be published by a direct
# `typescript-v*` tag push or a dispatch of this file -- those runs present a different
# workflow identity and are rejected at the registry. One entry point, one identity:
# `3 · Release — SDKs (manual)`.
on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      prerelease:
        required: false
        default: false
        type: boolean

# Least privilege by default; the jobs that publish or tag override this.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_version.outputs.version }}

    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Build SDK
        run: npm run build

      # A published release must not be untested. (The comment this replaces claimed 24
      # tests; there are 54.)
      - name: Run tests
        run: npm test

      # The two steps that used to sit here derived the version from `refs/tags/` and were
      # gated on `github.event_name == 'push'`. Both are now unreachable: this workflow is
      # `workflow_call`-only (see the note on the triggers), and inside a called workflow
      # `github.event_name` is the CALLER's event, which for `release.yml` is
      # `workflow_dispatch`. A step that can never run reads like a path that works, so
      # they are gone rather than left as decoration.

      - name: Update package version (manual/called)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.version != ''
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          cat package.json | grep version

      - name: Get package version
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify package contents
        run: |
          echo "Package contents:"
          npm pack --dry-run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: |
            typescript/dist/
            typescript/package.json
            typescript/README.md
          retention-days: 1

  publish-npmjs:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # OIDC: npm exchanges this short-lived token for publish rights, so no
      # npm token is involved at all. Must also be granted by the CALLING job in
      # release.yml -- the docs are explicit that both parent and child need it.
      id-token: write
      # For the GitHub Packages mirror below, which authenticates with GITHUB_TOKEN.
      packages: write

    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-build
          path: typescript/

      # npmjs, not GitHub Packages: a package on GitHub Packages needs authentication to
      # INSTALL, which is the wrong shape for a public client SDK.
      #
      # NO `registry-url:` here, deliberately. That input makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with no
      # token in the environment that line resolves to an EMPTY credential -- which npm
      # sends as auth rather than falling through to OIDC. The registry lives in
      # package.json's `publishConfig` instead, where it is also true for a human running
      # `npm publish` locally.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14). Node 24 ships an npm 11
      # whose patch level varies by minor, so this asserts rather than assumes: a too-old
      # npm does not fail, it quietly asks for a token and 404s or 401s on a package it
      # cannot authenticate for, which is a confusing way to learn about a version floor.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need; upgrading for OIDC support"
            npm install -g "npm@>=$need"
          fi
          echo "npm $(npm --version), node $(node --version)"

      # The step that used to sit here ran
      #   sed -i 's/"name": "@horus\/client"/"name": "@aterve\/horux-client"/' package.json
      # against a package already called `@aterve/horux-client`, so it matched nothing and
      # renamed nothing. Deleted rather than kept: the name belongs in package.json, and a
      # substitution that silently no-ops is worse than no substitution.

      - name: Update version
        run: |
          npm version ${{ needs.build.outputs.version }} --no-git-tag-version --allow-same-version

      # Trusted publishing (OIDC) is the intended path: npm exchanges the workflow's
      # short-lived OIDC token for publish rights, so there is no long-lived npm token to
      # leak or rotate, and provenance is attached automatically for a public package from
      # a public repository.
      #
      # THE TOKEN BRANCH IS A BOOTSTRAP, NOT A FALLBACK. npm will not let you configure a
      # trusted publisher for a package that does not exist yet, so the FIRST publish of
      # `@aterve/horux-client` has to be authenticated the old way. Set NPM_PUBLISH_TOKEN,
      # release once, configure the trusted publisher on npmjs (workflow file:
      # `release.yml` -- npm validates the CALLING workflow), then DELETE the secret. With
      # it gone this step takes the OIDC path and says so in the log.
      #
      # `--access public`: a scoped package defaults to restricted, and the first publish
      # of a scope is where that bites. `publishConfig` says it too; this is belt and braces.
      # The dist-tag, decided once and used by BOTH publishes below. `npm publish`
      # otherwise always writes `latest`, and `inputs.prerelease` reached only the GitHub
      # Release flag -- so publishing 1.2.0-rc.1 would have moved `latest` onto a
      # prerelease and every plain `npm install @aterve/horux-client` would have resolved
      # to it. Decided from the version rather than the input, because the version is what
      # semver and the registry agree on: a `-` suffix means prerelease.
      #
      # In its own step because each `run:` is its own shell: computed inside the npmjs
      # publish, `$TAG` was empty by the time the mirror ran.
      - name: Decide the dist-tag
        id: disttag
        run: |
          set -euo pipefail
          VERSION='${{ needs.build.outputs.version }}'
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION under dist-tag '$TAG'"

      - name: Publish to npmjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          PKG: '@aterve/horux-client'
          VERSION: ${{ steps.disttag.outputs.version }}
          TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail

          # Skip if this exact version is already on npmjs. Not error-swallowing: it is a
          # positive existence check, and it exists because a release can fail AFTER this
          # step -- the GitHub Packages mirror failed on 1.1.2 with npmjs already published,
          # and without this a re-run dies on `E409 Cannot publish over previously staged
          # version` before it can finish the half that is still missing.
          if npm view "$PKG@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already on npmjs; skipping (this is a re-run)."
          elif [ -n "${NPM_TOKEN:-}" ]; then
            echo "::warning::Publishing with NPM_PUBLISH_TOKEN. This is the bootstrap path:"
            echo "::warning::once the package exists, configure trusted publishing on npmjs"
            echo "::warning::for workflow 'release.yml' and delete this secret."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm publish --ignore-scripts --access public --tag "$TAG"
          else
            echo "No NPM_PUBLISH_TOKEN present: publishing via trusted publishing (OIDC)."
            echo "Provenance is attached automatically on this path."
            npm publish --ignore-scripts --access public --tag "$TAG"
          fi

      # The same tarball, mirrored to GitHub Packages. npmjs is the canonical registry and
      # goes FIRST deliberately: if this step fails the release is red with the version
      # already on npmjs, which is a state you can read and finish by hand -- whereas the
      # reverse order would leave the mirror ahead of the registry everyone installs from.
      #
      # Three things differ from the npmjs publish:
      #   * the registry is overridden on the CLI, because package.json's publishConfig
      #     points `@aterve` at npmjs (it has to -- that is what the first failed publish
      #     taught us) and publishConfig cannot be per-registry;
      #   * `--provenance false`, because provenance is an npmjs/sigstore feature and
      #     publishConfig turns it on globally. Left on, this step fails;
      #   * GITHUB_TOKEN, not OIDC. GitHub Packages has no trusted publishing.
      #
      # Note for consumers: a package here needs `read:packages` auth to install even
      # though the repository is public. npmjs is the one to tell people about.
      - name: Mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: '@aterve/horux-client'
          VERSION: ${{ steps.disttag.outputs.version }}
          TAG: ${{ steps.disttag.outputs.tag }}
          GHP: https://npm.pkg.github.com
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc.ghp

          if npm view "$PKG@$VERSION" version --userconfig .npmrc.ghp --registry "$GHP" >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already on GitHub Packages; skipping."
            rm -f .npmrc.ghp
            exit 0
          fi

          # `publishConfig` in package.json OVERRIDES the CLI at publish time -- including
          # `--registry`. The first attempt passed `--registry https://npm.pkg.github.com`
          # and npm published to npmjs anyway, announcing
          # `Publishing to https://registry.npmjs.org`, then failed E409 against the version
          # it had just pushed there. So the pin has to come out of the manifest for this
          # publish: provenance with it, since that is an npmjs/sigstore feature and a
          # `publishConfig.provenance: true` cannot be turned off from the command line
          # either. package.json is restored immediately afterwards.
          cp package.json package.json.orig
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.publishConfig = { access: "public" };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          trap 'mv -f package.json.orig package.json' EXIT

          npm publish \
            --userconfig .npmrc.ghp \
            --registry "$GHP" \
            --ignore-scripts \
            --access public \
            --tag "$TAG"

          rm -f .npmrc.ghp
          echo "mirrored $VERSION to GitHub Packages under dist-tag '$TAG'"

      - name: Summarise what was published
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          REPO_OWNER="${{ github.repository_owner }}"
          echo "## GitHub Package Published 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`@${REPO_OWNER}/horux-client\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @${REPO_OWNER}/horux-client@${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-npmjs]
    # Runs on every release, not only a tag push. The condition here used to be
    # `github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')`, and inside a
    # called workflow `github.event_name` is the CALLER's event -- `workflow_dispatch` for
    # release.yml -- so this job was SKIPPED on every release. Demonstrated on the first
    # real publish: @aterve/horux-client@1.1.0 went to npmjs and the repository kept no tag
    # and no release to say so. `needs` already gates this on a successful publish.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: typescript-v${{ needs.build.outputs.version }}
          release_name: TypeScript SDK v${{ needs.build.outputs.version }}
          body: |
            # TypeScript SDK v${{ needs.build.outputs.version }}

            ## Installation

            Public on npmjs, so no `.npmrc` and no authentication:
            ```bash
            npm install @${{ github.repository_owner }}/horux-client@${{ needs.build.outputs.version }}
            ```

            ## Quick Start

            ```typescript
            import { HoruxClient } from '@aterve/horux-client';

            const client = new HoruxClient({
              apiToken: process.env.HORUX_API_TOKEN,
              serviceId: process.env.HORUX_SERVICE_ID,
            });

            // Send metrics
            client.metrics.counter('http.requests.total', 1, { method: 'GET', status: '200' });
            client.metrics.gauge('response.time', 145.5, { endpoint: '/api/users' });

            // Send logs
            client.logs.info('User logged in', { userId: '123', ip: '192.168.1.1' });

            // Flush and close
            await client.close();
            ```

            ## GitHub Package

            https://github.com/${{ github.repository }}/packages

            ## Changes

            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/typescript/CHANGELOG.md) for details.

            ## Documentation

            - [README](https://github.com/${{ github.repository }}/blob/main/typescript/README.md)
          draft: false
          prerelease: ${{ inputs.prerelease || contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'beta') || contains(needs.build.outputs.version, 'rc') }}
