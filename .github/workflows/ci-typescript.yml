name: 1 · CI — TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  workflow_call:

# Least privilege by default; the jobs that publish or tag override this.
permissions:
  contents: read

# Concurrency group: a LITERAL key, not ${ github.workflow }.
#
# Inside a workflow invoked with `uses:`, `github.workflow` is the CALLER's workflow
# name, not this file's. With `${ github.workflow }-${ github.ref }` every component
# workflow therefore computed the same group as ci-all.yml itself -- the group its own
# caller already held, with cancel-in-progress: true -- so each call collided with its
# parent and died at dispatch, producing no jobs and reporting `failure`. That made
# "All CI Checks Passed" a gate that could never pass, on every commit and every PR.
concurrency:
  group: ci-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # There is no `lint` or `format:check` script in this package and neither eslint nor
      # prettier is a dependency, so the two steps that used to sit here --
      # `npm run lint || echo "No lint script configured"` behind continue-on-error --
      # passed vacuously on every run. A step that cannot fail is worse than no step: it
      # reads as a gate. Adopting a linter here means adding the dependency, a config and
      # a script, and is a change worth making deliberately rather than implying.
      - name: Confirm there is still nothing to lint
        run: |
          set -euo pipefail
          if node -e "p=require('./package.json');process.exit(p.scripts&&p.scripts.lint?0:1)"; then
            echo "::error::package.json now has a lint script, so this placeholder is stale."
            echo "::error::Replace this step with: npm run lint"
            exit 1
          fi
          echo "No lint script and no linter dependency; nothing to check."

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK
        run: npm run build

      - name: Check build artifacts
        run: |
          echo "Checking build output..."
          ls -la dist/
          echo "Verifying package exports..."
          test -f dist/index.js || (echo "Missing main export file" && exit 1)
          test -f dist/index.d.ts || (echo "Missing type declarations" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: typescript/dist/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Was `npm test || echo "No tests configured yet"` with continue-on-error on
      # top — double-swallowed, and the comment was false: package.json defines a
      # real `test` script (tsc -p tsconfig.test.json && node --test) and
      # src/dispatcher.spec.ts has 24 passing tests. Verified locally on Node 24:
      # 24 pass, 0 fail. DECISIONS.md #2 re-enables this suite by name.
      #
      # Still tolerated on Node 20 only: the script passes a glob to `node --test`,
      # and glob expansion by the test runner needs Node >= 22. Making the script
      # version-agnostic is a change to typescript/package.json, which W14
      # owns — filed as a cross-workstream request. Blocking on 22 and 24 today.
      - name: Run tests
        continue-on-error: ${{ matrix.node-version == '20' }}
        run: npm test

      - name: Upload coverage reports
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        if: matrix.node-version == '24' && always()
        with:
          files: ./typescript/coverage/lcov.info
          flags: typescript
          name: typescript-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  package-check:
    name: Package Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: Validate package.json
        run: |
          node -e "
          const pkg = require('./package.json');
          const required = ['name', 'version', 'main', 'types', 'license'];
          required.forEach(field => {
            if (!pkg[field]) {
              console.error('Missing required field:', field);
              process.exit(1);
            }
          });
          console.log('Package.json validation passed');
          "

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aterve'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  all-checks:
    name: All TypeScript SDK Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test, package-check, dependency-audit]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.lint.result }}" == "cancelled" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" || "${{ needs.typecheck.result }}" == "cancelled" ]] || \
             [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build.result }}" == "cancelled" ]] || \
             [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]] || \
             [[ "${{ needs.package-check.result }}" == "failure" || "${{ needs.package-check.result }}" == "cancelled" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          # Note: dependency-audit is not included in failure check as it's informational
